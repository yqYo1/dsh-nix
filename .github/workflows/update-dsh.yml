# Tag-only DSH updater: released tags in, draft PRs out, human merge gate kept.
#
# What this workflow does NOT do (deliberate, do not re-add):
#   - No merge of packaging upstream (Samuka007/dsh-nix), no `-X ours`.
#     Packaging sync is a human decision with conflicts, not automation fodder.
#   - No tracking of arbitrary deepseek-harness main HEAD. Only released
#     `dsh-v*` tags (or an explicit `dsh_tag` dispatch input), re-locked to
#     an immutable rev + narHash in flake.lock.
#   - No push to main, no `--force`, no `--admin`/bypass. The only push is
#     the updater branch itself via an explicit refspec; main moves only
#     through human PR review + merge.
#   - No PR from a red build. scripts/update-dsh.sh fails closed (real
#     `nix build` + `nix flake check`); the PR step never runs then.
#
# SIGNED-COMMIT CONSTRAINT: automation commits with GITHUB_TOKEN are
# UNSIGNED. The `signature-gate` step checks main's branch protection: if
# required_signatures is enforced, the run stops BEFORE push/PR instead of
# inventing keys or bypassing. If your fork does not enforce signatures,
# the bot commit works as-is with the permissions below.
name: update-dsh

on:
  schedule:
    - cron: "17 3 * * *"  # daily 03:17 UTC
  workflow_dispatch:
    inputs:
      dsh_tag:
        description: "Exact deepseek-harness tag (e.g. dsh-v0.2.0-rc.2); empty = latest dsh-v*"
        required: false
        default: ""

# Branch pushes need contents:write, PR creation needs pull-requests:write.
# Nothing here needs administration, secrets, or checks-bypass scopes.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-dsh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0  # 11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41879575+github-actions[bot]@users.noreply.github.com"

      - name: Signature gate (fail closed on signed-commit contracts)
        id: siggate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fail CLOSED on auth/API failures: only a positive "not
          # protected" answer (or an explicit disabled flag) may proceed.
          # Any other lookup error stops the run BEFORE unsigned push/PR
          # instead of assuming signatures are disabled.
          err_file="$(mktemp)"
          if required=$(gh api "repos/${GH_REPO}/branches/main/protection" \
            --jq '.required_signatures.enabled // false' 2>"$err_file"); then
            :
          elif grep -qi 'branch not protected' "$err_file"; then
            # No protection at all: signatures cannot be required.
            required=false
          else
            cat "$err_file" >&2
            echo "::error::branch-protection lookup failed (auth/API error); refusing to assume signatures are disabled — stopping before push/PR." >&2
            exit 1
          fi
          echo "required=${required}" >> "$GITHUB_OUTPUT"
          if [ "$required" = "true" ]; then
            echo "::notice::main requires signed commits; automation commits are unsigned — stopping before push/PR. Provide a signing setup or run the update manually."
          fi

      - name: Retarget dsh input to released tag (build + check gated)
        id: bump
        if: steps.siggate.outputs.required != 'true'
        env:
          DSH_TAG_INPUT: ${{ inputs.dsh_tag }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "${DSH_TAG_INPUT}" ]; then
            ARGS+=(--tag "${DSH_TAG_INPUT}")
          fi
          chmod +x scripts/update-dsh.sh
          ./scripts/update-dsh.sh "${ARGS[@]}"

      - name: Open draft PR (never push to main)
        if: steps.siggate.outputs.required != 'true' && steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_TAG: ${{ steps.bump.outputs.tag }}
          BUMP_SHA: ${{ steps.bump.outputs.sha }}
          BUMP_VER: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${BUMP_TAG}"
          SHA="${BUMP_SHA}"
          VER="${BUMP_VER}"
          BRANCH="automation/bump-dsh-${TAG}"
          if [ "$BRANCH" = "main" ]; then
            echo "refusing to push to main" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/heads/${BRANCH}"; then
            git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          git add flake.nix flake.lock
          git commit -m "chore(dsh): retarget input to ${TAG} (${SHA:0:12}, version ${VER})" || true
          # Explicit refspec: only the updater branch moves. No --force.
          git push origin "HEAD:refs/heads/${BRANCH}"
          if gh pr list --head "$BRANCH" --json number --jq -e '.[0].number' >/dev/null; then
            echo "PR already exists for ${BRANCH}; leaving it for human review"
          else
            gh pr create --draft --head "$BRANCH" --base main \
              --title "chore(dsh): update to ${TAG}" \
              --body "Automated tag update, verified by \`nix build\` + \`nix flake check\` before opening.
          - tag: \`${TAG}\`
          - commit: \`${SHA}\`
          - source package version (apps/cli at tag): \`${VER}\`
          - lock: immutable rev + narHash in flake.lock

          If CI on this PR is red on the pnpm store hash, the package owner finishes \`version\` + \`hash\` in \`pkgs/dsh.nix\` (updater never edits owner files). Merge only after human review."
          fi
